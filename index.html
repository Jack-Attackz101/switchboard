<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switchboard</title>
<style>
:root{
  --bg:#ffffff;
  --side:#f7f7f8;
  --side2:#eeeef0;
  --line:#dcdce0;
  --line2:#e8e8ea;
  --ink:#1d1d1f;
  --dim:#86868b;
  --dimmer:#a1a1a6;
  --me:#0b84fe;
  --them:#e9e9eb;
  --sel:#d3d3d8;
  --grn:#30d158;
  --amb:#ff9f0a;
  --red:#ff453a;
  --sh:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1e1e1e; --side:#252526; --side2:#2d2d2f; --line:#3a3a3c; --line2:#333335;
    --ink:#f2f2f7; --dim:#98989d; --dimmer:#6e6e73; --them:#3a3a3c; --sel:#0b84fe;
    --sh:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
#app{display:flex;height:100vh}

/* ---------------- sidebar ---------------- */
#side{
  width:288px;min-width:288px;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column
}
#sidetop{padding:12px 12px 8px;-webkit-app-region:drag}
#brand{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#brand b{font-size:15px;font-weight:650;letter-spacing:-.2px}
#dot{width:7px;height:7px;border-radius:50%;background:var(--dimmer);transition:background .3s}
#dot.on{background:var(--grn)}
#newbtn{
  margin-left:auto;width:26px;height:26px;border-radius:7px;border:none;cursor:pointer;
  background:var(--side2);color:var(--ink);font-size:15px;line-height:1;display:grid;place-items:center
}
#newbtn:hover{background:var(--sel);color:#fff}
#search{
  width:100%;padding:6px 10px;border-radius:8px;border:none;background:var(--side2);
  color:var(--ink);font:inherit;font-size:13px;outline:none
}
#search::placeholder{color:var(--dimmer)}
#convs{flex:1;overflow-y:auto;padding:4px 8px 12px}
#convs::-webkit-scrollbar{width:7px}
#convs::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}
#convs:hover::-webkit-scrollbar-thumb{background:var(--line)}
.grp{font-size:11px;font-weight:600;color:var(--dimmer);padding:12px 8px 4px;letter-spacing:.02em}
.cv{
  display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:9px;cursor:pointer;
  user-select:none;position:relative
}
.cv:hover{background:var(--side2)}
.cv.on{background:var(--sel)}
.cv.on .nm,.cv.on .pv,.cv.on .tm{color:#fff}
@media (prefers-color-scheme:light){ .cv.on .nm{color:#111} .cv.on .pv,.cv.on .tm{color:#3b3b40} }
.av{
  width:34px;height:34px;min-width:34px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:600;color:#fff;position:relative;letter-spacing:-.3px
}
.av .st{
  position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;
  border:2px solid var(--side)
}
.cv.on .av .st{border-color:var(--sel)}
.meta{flex:1;min-width:0}
.row1{display:flex;align-items:baseline;gap:6px}
.nm{font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:11px;color:var(--dimmer);margin-left:auto;white-space:nowrap}
.pv{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv.act{color:var(--me);font-weight:500}
.cv.on .pv.act{color:#fff}
.badge{
  min-width:18px;height:18px;border-radius:9px;background:var(--me);color:#fff;font-size:11px;
  font-weight:600;display:grid;place-items:center;padding:0 5px;margin-left:4px
}
.cv.on .badge{background:#fff;color:var(--me)}

/* ---------------- thread ---------------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#head{
  height:52px;min-height:52px;border-bottom:1px solid var(--line2);display:flex;align-items:center;
  gap:10px;padding:0 16px;-webkit-app-region:drag
}
#htitle{font-size:14px;font-weight:600;letter-spacing:-.1px}
#hsub{font-size:12px;color:var(--dim)}
#hsub.live{color:var(--me);font-weight:500}
#hact{margin-left:auto;display:flex;gap:6px}
.hbtn{
  border:none;background:transparent;color:var(--dim);cursor:pointer;font:inherit;font-size:12.5px;
  padding:5px 9px;border-radius:7px
}
.hbtn:hover{background:var(--side2);color:var(--ink)}
#msgs{flex:1;overflow-y:auto;padding:18px 18px 6px;display:flex;flex-direction:column;gap:2px}
#msgs::-webkit-scrollbar{width:9px}
#msgs::-webkit-scrollbar-thumb{background:transparent;border-radius:5px}
#msgs:hover::-webkit-scrollbar-thumb{background:var(--line)}
.day{text-align:center;font-size:11px;color:var(--dimmer);margin:14px 0 8px;font-weight:500}
.who{font-size:11px;color:var(--dim);margin:8px 0 2px 11px;font-weight:500}
.b{
  max-width:min(560px,72%);padding:7px 13px;border-radius:18px;font-size:14px;line-height:1.4;
  white-space:pre-wrap;word-wrap:break-word;position:relative;animation:pop .18s ease-out
}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
.b.them{background:var(--them);color:var(--ink);align-self:flex-start;border-bottom-left-radius:5px}
.b.me{background:var(--me);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.b.sys{
  background:transparent;color:var(--dim);align-self:center;text-align:center;font-size:12px;
  max-width:78%;padding:5px 12px;border:1px solid var(--line2);border-radius:12px
}
.b.err{color:var(--red);border-color:var(--red)}
.b+.b.them{border-bottom-left-radius:5px;border-top-left-radius:5px;margin-top:1px}
.b+.b.me{border-bottom-right-radius:5px;border-top-right-radius:5px;margin-top:1px}
.b:last-of-type.them{border-bottom-left-radius:18px}
.b:last-of-type.me{border-bottom-right-radius:18px}
.b pre{
  background:rgba(127,127,127,.16);padding:9px 11px;border-radius:9px;overflow-x:auto;margin:6px 0;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre
}
.b code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(127,127,127,.16);padding:1px 5px;border-radius:5px}
.b.me pre,.b.me code{background:rgba(255,255,255,.2)}
.typing{align-self:flex-start;background:var(--them);border-radius:18px;border-bottom-left-radius:5px;padding:11px 15px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dimmer);animation:tp 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---------------- composer ---------------- */
#comp{padding:10px 16px 14px;border-top:1px solid var(--line2)}
#cwrap{
  display:flex;align-items:flex-end;gap:8px;background:var(--side2);border-radius:19px;
  padding:5px 5px 5px 14px;border:1px solid transparent
}
#cwrap:focus-within{border-color:var(--me)}
#inp{
  flex:1;border:none;background:transparent;color:var(--ink);font:inherit;font-size:14px;resize:none;
  outline:none;max-height:160px;padding:6px 0;line-height:1.4
}
#inp::placeholder{color:var(--dimmer)}
#send{
  width:28px;height:28px;min-width:28px;border-radius:50%;border:none;background:var(--me);color:#fff;
  cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center;transition:.15s
}
#send:disabled{background:var(--line);color:var(--dimmer);cursor:default}
#files{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.chip{
  background:var(--side2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px;
  display:flex;gap:6px;align-items:center;color:var(--dim)
}
.chip b{font-weight:500;color:var(--ink);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip span{cursor:pointer}
#drop{
  position:fixed;inset:0;background:rgba(11,132,254,.1);border:3px dashed var(--me);z-index:60;
  display:none;place-items:center;font-size:16px;font-weight:600;color:var(--me);backdrop-filter:blur(2px)
}
#drop.on{display:grid}

/* ---------------- empty + modal ---------------- */
#empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--dim);padding:40px}
#empty h2{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:7px}
#empty p{font-size:13.5px;max-width:390px;line-height:1.6}
#empty code{font:12.5px ui-monospace,Menlo,monospace;background:var(--side2);padding:2px 6px;border-radius:5px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:70;display:none;place-items:center}
.mask.on{display:grid}
.modal{
  background:var(--bg);border-radius:13px;width:400px;max-width:92vw;box-shadow:0 18px 50px rgba(0,0,0,.28);
  overflow:hidden;border:1px solid var(--line)
}
.modal h3{padding:15px 18px 11px;font-size:14.5px;font-weight:620;border-bottom:1px solid var(--line2)}
.mbody{padding:12px 18px;max-height:330px;overflow-y:auto}
.mfoot{padding:11px 18px 15px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line2)}
.mbtn{border:none;border-radius:7px;padding:6px 15px;font:inherit;font-size:13px;cursor:pointer;background:var(--side2);color:var(--ink)}
.mbtn.p{background:var(--me);color:#fff;font-weight:500}
.mbtn:disabled{opacity:.45;cursor:default}
.pick{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:8px;cursor:pointer}
.pick:hover{background:var(--side2)}
.pick input{accent-color:var(--me);width:15px;height:15px}
.gname{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--side2);color:var(--ink);font:inherit;font-size:13px;outline:none;margin-bottom:10px}
.gname:focus{border-color:var(--me)}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="sidetop">
      <div id="brand"><span id="dot"></span><b>Switchboard</b>
        <button id="newbtn" title="New group">+</button></div>
      <input id="search" placeholder="Search" autocomplete="off">
    </div>
    <div id="convs"></div>
  </aside>
  <section id="main">
    <div id="head" style="display:none">
      <div><div id="htitle"></div><div id="hsub"></div></div>
      <div id="hact">
        <button class="hbtn" id="renameBtn">Rename</button>
        <button class="hbtn" id="clearBtn">Clear</button>
      </div>
    </div>
    <div id="empty">
      <div>
        <h2>Nobody is connected</h2>
        <p>Start the server with <code>node server.mjs</code>, then pick someone on the left.
           Everyone in <code>agents.json</code> shows up here automatically.</p>
      </div>
    </div>
    <div id="msgs" style="display:none"></div>
    <div id="comp" style="display:none">
      <div id="files"></div>
      <div id="cwrap">
        <textarea id="inp" rows="1" placeholder="Message"></textarea>
        <button id="send" disabled>&#8593;</button>
      </div>
    </div>
  </section>
</div>
<div id="drop">Drop files to attach</div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
const API = location.origin;
let AGENTS = [], GROUPS = [], TH = {}, UNREAD = {}, TYPING = {},
    CUR = null, connected = false, ATTACH = [], LASTSEEN = {}, Q = '';

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/** deterministic avatar colour, so an agent always looks the same */
function hue(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))%360; return h; }
function avatar(a){
  const nm = a.name || a.id;
  const init = a.members
    ? '#'
    : nm.split(/[\s-]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const h = hue(a.id);
  const st = a.members ? '' :
    `<i class="st" style="background:${
      a.status==='working' ? 'var(--amb)' :
      a.status==='error'   ? 'var(--red)' :
      a.enabled===false || a.status==='off' ? 'var(--dimmer)' : 'var(--grn)'}"></i>`;
  return `<div class="av" style="background:linear-gradient(145deg,hsl(${h} 62% 56%),hsl(${(h+38)%360} 62% 46%))">${esc(init)}${st}</div>`;
}
function timeOf(ts){
  const d = ts ? new Date(ts) : new Date();
  return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
function dayOf(ts){
  const d = ts? new Date(ts) : new Date(), n = new Date();
  const same = d.toDateString() === n.toDateString();
  if (same) return 'Today';
  const y = new Date(n); y.setDate(n.getDate()-1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
}
/** minimal markdown: fenced code, inline code. everything else stays literal. */
function fmt(t){
  const parts = String(t).split(/```/);
  return parts.map((p,i)=> i%2
    ? '<pre>'+esc(p.replace(/^\w*\n/,''))+'</pre>'
    : esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>')
  ).join('');
}

/* ---------------- conversations ---------------- */
function threadId(x){ return x.members ? 'g:'+x.id : 'a:'+x.id; }
function convs(){
  const list = [
    { id:'@all', name:'Everyone', members:AGENTS.map(a=>a.id), all:true },
    ...GROUPS.map(g=>({...g, members:g.members||[]})),
    ...AGENTS,
  ];
  if(!Q) return list;
  const q = Q.toLowerCase();
  return list.filter(c => (c.name||c.id).toLowerCase().includes(q));
}
function lastOf(tid){
  const t = TH[tid]; if(!t||!t.length) return null;
  return t[t.length-1];
}
function renderConvs(){
  const el = $('convs'); el.innerHTML='';
  const all = convs();
  const groups = all.filter(c=>c.members);
  const people = all.filter(c=>!c.members);

  const add = (c) => {
    const tid = c.all ? 'main' : threadId(c);
    const d = document.createElement('div');
    d.className = 'cv' + (CUR===tid ? ' on' : '');
    const last = lastOf(tid);
    const un = UNREAD[tid]||0;
    // a live tool activity beats the last message, since it is happening now
    const live = !c.members && c.activityText;
    const prev = live ? c.activityText
               : last ? (last.role==='you' ? 'You: ' : '') + String(last.text).replace(/\s+/g,' ').slice(0,60)
               : (c.members ? (c.members.length + ' agents') : (c.role||c.kind||''));
    d.innerHTML = avatar(c) +
      `<div class="meta">
         <div class="row1"><span class="nm">${esc(c.name||c.id)}</span>
           ${last?`<span class="tm">${timeOf(last.at)}</span>`:''}</div>
         <div class="pv ${live?'act':''}">${esc(prev)}</div>
       </div>` + (un?`<span class="badge">${un>99?'99+':un}</span>`:'');
    d.onclick = ()=> open(tid, c);
    el.appendChild(d);
  };
  if(groups.length){ const h=document.createElement('div'); h.className='grp'; h.textContent='GROUPS'; el.appendChild(h); groups.forEach(add); }
  if(people.length){ const h=document.createElement('div'); h.className='grp'; h.textContent='AGENTS'; el.appendChild(h); people.forEach(add); }
  if(!groups.length && !people.length){
    el.innerHTML = '<div class="grp" style="padding:16px 8px">No matches</div>';
  }
}

/* ---------------- thread ---------------- */
function open(tid, c){
  CUR = tid; UNREAD[tid] = 0; CURC = c;
  $('empty').style.display='none';
  $('head').style.display='flex'; $('msgs').style.display='flex'; $('comp').style.display='block';
  $('renameBtn').style.display = c.members ? 'none' : '';
  renderConvs(); renderHead(); renderMsgs();
  $('inp').focus();
}
let CURC = null;
function renderHead(){
  if(!CURC) return;
  $('htitle').textContent = CURC.name || CURC.id;
  const sub = $('hsub');
  if(CURC.members){
    sub.className=''; 
    sub.textContent = CURC.all ? AGENTS.length + ' agents' :
      CURC.members.map(id=>(AGENTS.find(a=>a.id===id)||{}).name||id).join(', ');
  } else if (CURC.activityText){
    sub.className='live'; sub.textContent = CURC.activityText;
  } else {
    sub.className='';
    const bits = [CURC.role || CURC.kind];
    if(CURC.enabled===false) bits.push('off');
    else if(CURC.status==='error') bits.push(CURC.healthNote||'needs setup');
    sub.textContent = bits.filter(Boolean).join(' · ');
  }
}
function renderMsgs(){
  const el = $('msgs'); el.innerHTML='';
  const t = TH[CUR]||[];
  let lastDay='', lastWho='';
  for(const m of t){
    const d = dayOf(m.at);
    if(d!==lastDay){ const s=document.createElement('div'); s.className='day'; s.textContent=d; el.appendChild(s); lastDay=d; lastWho=''; }
    if(m.role==='system'){
      const b=document.createElement('div');
      b.className='b sys'+(/needs a token|switched off|do not know how/i.test(m.text)?' err':'');
      b.innerHTML=fmt(m.text); el.appendChild(b); lastWho=''; continue;
    }
    const mine = m.role==='you';
    // in a group, label who is speaking when the speaker changes
    if(!mine && CURC && CURC.members && m.agent!==lastWho){
      const w=document.createElement('div'); w.className='who';
      w.textContent=(AGENTS.find(a=>a.id===m.agent)||{}).name||m.agent;
      el.appendChild(w);
    }
    lastWho = mine ? '' : m.agent;
    const b=document.createElement('div'); b.className='b '+(mine?'me':'them');
    b.innerHTML=fmt(m.text); b.title=timeOf(m.at); el.appendChild(b);
  }
  // typing dots for anyone we are waiting on in this thread
  const waiting = Object.keys(TYPING).filter(id=>TYPING[id] &&
      (CURC && (CURC.members ? (CURC.all||CURC.members.includes(id)) : CURC.id===id)));
  if(waiting.length){
    const w=document.createElement('div'); w.className='typing';
    w.innerHTML='<i></i><i></i><i></i>'; el.appendChild(w);
  }
  el.scrollTop = el.scrollHeight;
}

/* ---------------- sending ---------------- */
async function send(){
  const inp=$('inp'); let text=inp.value.trim();
  if(!text && !ATTACH.length) return;
  if(ATTACH.length){
    text += (text?'\n\n':'') + ATTACH.map(f=>`--- ${f.name} ---\n${f.text}`).join('\n\n');
    ATTACH=[]; renderFiles();
  }
  inp.value=''; inp.style.height='auto'; $('send').disabled=true;
  const to = CURC.all ? '@all' : CURC.members ? CURC.members : CURC.id;
  const targets = CURC.all ? AGENTS.filter(a=>a.enabled!==false).map(a=>a.id)
                : CURC.members ? CURC.members : [CURC.id];
  targets.forEach(id=>TYPING[id]=true);
  try{
    await fetch(API+'/api/send',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({to, thread:CUR, text})});
  }catch{
    (TH[CUR]||=[]).push({role:'system',text:'Could not reach the server. Is it still running?',at:Date.now()});
    targets.forEach(id=>TYPING[id]=false); renderMsgs();
  }
}
function renderFiles(){
  const el=$('files'); el.innerHTML='';
  ATTACH.forEach((f,i)=>{
    const c=document.createElement('div'); c.className='chip';
    c.innerHTML=`<b>${esc(f.name)}</b><span>&times;</span>`;
    c.querySelector('span').onclick=()=>{ATTACH.splice(i,1);renderFiles()};
    el.appendChild(c);
  });
}

/* ---------------- live stream ---------------- */
function ingest(e){
  if(e.type==='msg'){
    const tid=e.thread||'main';
    (TH[tid]||=[]).push({...e, at:e.at||Date.now()});
    if(e.role!=='you') TYPING[e.agent]=false;
    if(tid!==CUR && e.role!=='you') UNREAD[tid]=(UNREAD[tid]||0)+1;
    if(tid===CUR) renderMsgs();
    renderConvs();
  }
  if(e.type==='status'){
    const a=AGENTS.find(x=>x.id===e.agent);
    if(a){ a.status=e.status; renderConvs(); if(CURC&&CURC.id===a.id) renderHead(); }
  }
  if(e.type==='activity'){
    const a=AGENTS.find(x=>x.id===e.agent);
    if(a){ a.activity=e.activity; a.activityText=e.text;
           renderConvs(); if(CURC&&CURC.id===a.id) renderHead(); }
  }
  if(e.type==='meta'){
    const a=AGENTS.find(x=>x.id===e.agent);
    if(a && e.name){ a.name=e.name; renderConvs(); if(CURC&&CURC.id===a.id) renderHead(); }
  }
}
function stream(){
  try{
    const es=new EventSource(API+'/api/stream');
    es.onopen=()=>{ if(!connected) load(); };
    es.onmessage=m=>{ try{ ingest(JSON.parse(m.data)); }catch{} };
    es.onerror=()=>{ es.close(); connected=false; $('dot').classList.remove('on'); setTimeout(stream,4000); };
  }catch{ setTimeout(stream,4000); }
}
async function load(){
  try{
    const r=await fetch(API+'/api/agents',{signal:AbortSignal.timeout(3000)});
    const j=await r.json();
    AGENTS=j.agents||[]; GROUPS=j.groups||[];
    connected=true; $('dot').classList.add('on');
    renderConvs();
    if(!CUR && AGENTS.length) open('main', {id:'@all',name:'Everyone',members:AGENTS.map(a=>a.id),all:true});
  }catch{ connected=false; $('dot').classList.remove('on'); }
}
async function history(){
  try{
    const r=await fetch(API+'/api/events'); const j=await r.json();
    for(const e of (j.events||[])) if(e.type==='msg') (TH[e.thread||'main']||=[]).push({...e, at:e.at||Date.now()});
    renderConvs(); if(CUR) renderMsgs();
  }catch{}
}

/* ---------------- modals ---------------- */
function closeModal(){ $('mask').classList.remove('on'); }
$('mask').onclick = e => { if(e.target===$('mask')) closeModal(); };

function newGroup(){
  $('modal').innerHTML = `<h3>New group</h3>
    <div class="mbody">
      <input class="gname" id="gn" placeholder="Group name" autocomplete="off">
      ${AGENTS.map(a=>`<label class="pick"><input type="checkbox" value="${esc(a.id)}">${avatar(a)}
        <span>${esc(a.name)}</span></label>`).join('')}
    </div>
    <div class="mfoot"><button class="mbtn" id="gc">Cancel</button>
      <button class="mbtn p" id="gk" disabled>Create</button></div>`;
  $('mask').classList.add('on'); $('gn').focus();
  const boxes = [...$('modal').querySelectorAll('input[type=checkbox]')];
  const upd = ()=>{ $('gk').disabled = !($('gn').value.trim() && boxes.some(b=>b.checked)); };
  boxes.forEach(b=>b.onchange=upd); $('gn').oninput=upd;
  $('gc').onclick=closeModal;
  $('gk').onclick=async()=>{
    const name=$('gn').value.trim(), members=boxes.filter(b=>b.checked).map(b=>b.value);
    const id='g'+Date.now().toString(36);
    GROUPS.push({id,name,members});
    try{ await fetch(API+'/api/groups',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({groups:GROUPS})}); }catch{}
    closeModal(); renderConvs();
    open('g:'+id, {id,name,members});
  };
}
function renameAgent(){
  if(!CURC||CURC.members) return;
  $('modal').innerHTML=`<h3>Rename ${esc(CURC.name)}</h3>
    <div class="mbody"><input class="gname" id="rn" maxlength="18" value="${esc(CURC.name)}"></div>
    <div class="mfoot"><button class="mbtn" id="rc">Cancel</button>
      <button class="mbtn p" id="rk">Save</button></div>`;
  $('mask').classList.add('on');
  const f=$('rn'); f.focus(); f.select();
  $('rc').onclick=closeModal;
  $('rk').onclick=async()=>{
    const name=f.value.trim(); if(!name) return;
    try{ await fetch(API+'/api/rename',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({id:CURC.id,name})}); }catch{}
    CURC.name=name; const a=AGENTS.find(x=>x.id===CURC.id); if(a) a.name=name;
    closeModal(); renderConvs(); renderHead();
  };
}

/* ---------------- wiring ---------------- */
$('newbtn').onclick=newGroup;
$('renameBtn').onclick=renameAgent;
$('clearBtn').onclick=()=>{ if(CUR){ TH[CUR]=[]; renderMsgs(); renderConvs(); } };
$('search').oninput=e=>{ Q=e.target.value; renderConvs(); };
$('send').onclick=send;
const inp=$('inp');
inp.oninput=()=>{
  inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,160)+'px';
  $('send').disabled = !(inp.value.trim()||ATTACH.length);
};
inp.onkeydown=e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); if(!$('send').disabled) send(); }
};
document.onkeydown=e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){ e.preventDefault(); $('search').focus(); $('search').select(); }
  if(e.key==='Escape'){ if($('mask').classList.contains('on')) closeModal(); else { $('search').value=''; Q=''; renderConvs(); } }
};
// drag files straight into the conversation
let dragDepth=0;
addEventListener('dragenter',e=>{ e.preventDefault(); if(++dragDepth===1&&CUR) $('drop').classList.add('on'); });
addEventListener('dragleave',()=>{ if(--dragDepth<=0){ dragDepth=0; $('drop').classList.remove('on'); } });
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{
  e.preventDefault(); dragDepth=0; $('drop').classList.remove('on');
  if(!CUR) return;
  for(const f of [...(e.dataTransfer.files||[])].slice(0,6)){
    if(f.size>240*1024){
      ATTACH.push({name:f.name, text:'[skipped, larger than 240kb]'}); continue;
    }
    try{ ATTACH.push({name:f.name, text:await f.text()}); }catch{}
  }
  renderFiles(); $('send').disabled=!( $('inp').value.trim()||ATTACH.length );
});

renderConvs(); stream(); load(); history();
setInterval(()=>{ if(connected) load(); }, 15000);
</script>
</body>
</html>
