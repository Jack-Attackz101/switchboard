<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switchboard</title>
<style>
:root{
  --ink:#0f1722;
  --dim:#54637a;
  --dimmer:#8a99ad;
  --blue:#0a84ff;
  --blue2:#3aa0ff;
  --blueDeep:#0060df;
  --glass:rgba(255,255,255,.38);
  --glassLine:rgba(255,255,255,.65);
  --hair:rgba(120,140,170,.20);
  --them:rgba(255,255,255,.66);
  --r:26px;
  --shadow:0 8px 30px rgba(30,60,100,.12), 0 2px 8px rgba(30,60,100,.08);
  --inset:inset 0 1px 0 rgba(255,255,255,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  color:var(--ink); overflow:hidden; -webkit-font-smoothing:antialiased; background:#8fc4f0;
}
/* ---- the sky, built from gradients so there are still no assets ---- */
#sky{position:fixed;inset:0;z-index:-2;overflow:hidden;
  background:
    radial-gradient(140% 100% at 78% 6%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 42%),
    linear-gradient(#1e7ad9 0%, #3f95e8 24%, #62aef2 50%, #8bc8f8 76%, #b6ddfb 100%);
}
#sky::before,#sky::after{content:'';position:absolute;inset:-25% -15%;
  background-repeat:no-repeat;filter:blur(1px)}
#sky::before{
  /* puffy cumulus: tight white cores that fall off fast, so they read as clouds
     rather than a haze */
  background:
   radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.92) 42%,rgba(255,255,255,0) 78%) 10% 20%/30% 22%,
   radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.9) 40%,rgba(255,255,255,0) 76%) 21% 13%/24% 17%,
   radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.85) 42%,rgba(255,255,255,0) 78%) 32% 22%/26% 16%,
   radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.9) 40%,rgba(255,255,255,0) 76%) 64% 10%/32% 22%,
   radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.82) 42%,rgba(255,255,255,0) 78%) 78% 19%/28% 18%,
   radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.78) 42%,rgba(255,255,255,0) 78%) 92% 8%/24% 16%;
  opacity:.97; animation:drift 90s linear infinite;
}
#sky::after{
  background:
   radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.7) 40%,rgba(255,255,255,0) 76%) 6% 58%/34% 22%,
   radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.6) 40%,rgba(255,255,255,0) 76%) 18% 68%/30% 18%,
   radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.62) 40%,rgba(255,255,255,0) 76%) 52% 80%/38% 22%,
   radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.55) 40%,rgba(255,255,255,0) 76%) 88% 70%/30% 20%;
  opacity:.9; filter:blur(3px); animation:drift 140s linear infinite reverse;
}
@keyframes drift{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
@media (prefers-reduced-motion:reduce){#sky::before,#sky::after{animation:none}}

#app{display:flex;height:100vh;gap:14px;padding:16px}

.glass{
  background:var(--glass);
  backdrop-filter:blur(34px) saturate(200%);
  -webkit-backdrop-filter:blur(34px) saturate(200%);
  border:1px solid var(--glassLine);
  border-radius:var(--r);
  box-shadow:var(--shadow),var(--inset);
}

/* ---------------- sidebar ---------------- */
#side{width:290px;min-width:290px;display:flex;flex-direction:column;overflow:hidden}
#sidetop{padding:16px 14px 10px}
#brand{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding:0 4px}
#brand b{font-size:16px;font-weight:680;letter-spacing:-.35px}
#dot{width:8px;height:8px;border-radius:50%;background:rgba(120,140,170,.5);
  box-shadow:0 0 0 3px rgba(255,255,255,.4);transition:.3s}
#dot.on{background:#30d158;box-shadow:0 0 0 3px rgba(48,209,88,.22)}
#newbtn{
  margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.8);
  cursor:pointer;color:#fff;font-size:17px;line-height:1;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 30% 22%,var(--blue2),var(--blue) 52%,var(--blueDeep));
  box-shadow:0 4px 12px rgba(10,132,255,.35), inset 0 1px 1px rgba(255,255,255,.75);
  transition:transform .15s
}
#newbtn:active{transform:scale(.92)}
#search{
  width:100%;padding:9px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.75);
  background:rgba(255,255,255,.5);color:var(--ink);font:inherit;font-size:13.5px;outline:none;
  box-shadow:var(--inset)
}
#search::placeholder{color:var(--dimmer)}
#search:focus{background:rgba(255,255,255,.78);border-color:rgba(10,132,255,.5)}
#convs{flex:1;overflow-y:auto;padding:2px 10px 14px}
#convs::-webkit-scrollbar{width:8px}
#convs::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}
#convs:hover::-webkit-scrollbar-thumb{background:rgba(120,140,170,.28)}
.grp{font-size:11px;font-weight:700;color:rgba(60,85,120,.62);padding:13px 8px 5px;letter-spacing:.5px}
.cv{
  display:flex;gap:10px;align-items:center;padding:8px 9px;border-radius:18px;cursor:pointer;
  user-select:none;margin-bottom:2px;border:1px solid transparent;transition:background .14s
}
.cv:hover{background:rgba(255,255,255,.45)}
.cv.on{
  background:rgba(255,255,255,.82);border-color:rgba(255,255,255,.95);
  box-shadow:0 4px 14px rgba(40,80,130,.13),var(--inset)
}
.av{
  width:38px;height:38px;min-width:38px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:680;color:#fff;position:relative;letter-spacing:-.4px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7), 0 2px 7px rgba(30,60,100,.22)
}
.av .st{
  position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(0,0,0,.15)
}
.meta{flex:1;min-width:0}
.row1{display:flex;align-items:baseline;gap:6px}
.nm{font-size:13.5px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.15px}
.tm{font-size:11px;color:var(--dimmer);margin-left:auto;white-space:nowrap}
.pv{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv.act{color:var(--blue);font-weight:600}
.badge{
  min-width:20px;height:20px;border-radius:10px;color:#fff;font-size:11px;font-weight:680;
  display:grid;place-items:center;padding:0 6px;margin-left:4px;
  background:radial-gradient(120% 120% at 30% 22%,var(--blue2),var(--blue) 60%,var(--blueDeep));
  box-shadow:0 2px 6px rgba(10,132,255,.4),inset 0 1px 1px rgba(255,255,255,.6)
}

/* ---------------- thread ---------------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}
#head{
  height:62px;min-height:62px;display:flex;align-items:center;gap:11px;padding:0 20px;
  border-bottom:1px solid var(--hair);
  background:linear-gradient(rgba(255,255,255,.32),rgba(255,255,255,.06))
}
#htitle{font-size:15px;font-weight:680;letter-spacing:-.25px}
#hsub{font-size:12.5px;color:var(--dim)}
#hsub.live{color:var(--blue);font-weight:600}
#hact{margin-left:auto;display:flex;gap:7px}
.hbtn{
  border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.42);color:var(--dim);
  cursor:pointer;font:inherit;font-size:12.5px;font-weight:550;padding:7px 14px;border-radius:14px;
  box-shadow:var(--inset);transition:.14s
}
.hbtn:hover{background:rgba(255,255,255,.8);color:var(--ink)}
.hbtn:active{transform:scale(.96)}
#msgs{flex:1;overflow-y:auto;padding:20px 22px 8px;display:flex;flex-direction:column;gap:2px}
#msgs::-webkit-scrollbar{width:9px}
#msgs::-webkit-scrollbar-thumb{background:transparent;border-radius:5px}
#msgs:hover::-webkit-scrollbar-thumb{background:rgba(120,140,170,.28)}
.day{
  align-self:center;font-size:11px;color:var(--dim);margin:14px 0 10px;font-weight:620;
  background:rgba(255,255,255,.55);padding:4px 13px;border-radius:11px;
  border:1px solid rgba(255,255,255,.7);box-shadow:var(--inset)
}
.who{font-size:11px;color:var(--dim);margin:9px 0 3px 14px;font-weight:620}
.b{
  max-width:min(620px,74%);padding:9px 15px;border-radius:21px;font-size:14.5px;line-height:1.45;
  white-space:pre-wrap;word-wrap:break-word;position:relative;animation:pop .2s cubic-bezier(.2,.9,.3,1.2)
}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.b.them{
  background:var(--them);color:var(--ink);align-self:flex-start;border-bottom-left-radius:7px;
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 3px 12px rgba(30,60,100,.10),inset 0 1px 0 rgba(255,255,255,.95);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)
}
.b.me{
  color:#fff;align-self:flex-end;border-bottom-right-radius:7px;
  background:linear-gradient(160deg,#4aa8ff,#0a84ff 46%,#0069e0);
  box-shadow:0 4px 14px rgba(10,132,255,.34),inset 0 1px 1px rgba(255,255,255,.42);
  border:1px solid rgba(255,255,255,.28)
}
.b.sys{
  background:rgba(255,255,255,.5);color:var(--dim);align-self:center;text-align:center;
  font-size:12.5px;max-width:80%;padding:8px 16px;border:1px solid rgba(255,255,255,.75);
  border-radius:15px;box-shadow:var(--inset)
}
.b.err{color:#c0392b;border-color:rgba(220,80,60,.4);background:rgba(255,236,232,.7)}
.b+.b.them{margin-top:2px;border-top-left-radius:8px}
.b+.b.me{margin-top:2px;border-top-right-radius:8px}
.b pre{
  background:rgba(20,40,70,.09);padding:10px 12px;border-radius:12px;overflow-x:auto;margin:7px 0;
  font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;
  border:1px solid rgba(255,255,255,.5)
}
.b code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(20,40,70,.09);
  padding:1.5px 6px;border-radius:6px}
.b.me pre,.b.me code{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.3)}
.typing{
  align-self:flex-start;background:var(--them);border-radius:21px;border-bottom-left-radius:7px;
  padding:13px 17px;display:flex;gap:5px;border:1px solid rgba(255,255,255,.85);
  box-shadow:0 3px 12px rgba(30,60,100,.10)
}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--dimmer);animation:tp 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{opacity:.34;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ---------------- composer ---------------- */
#comp{padding:10px 18px 18px}
#files{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px;padding:0 6px}
.chip{
  background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.85);border-radius:13px;
  padding:5px 11px;font-size:12px;display:flex;gap:7px;align-items:center;color:var(--dim);
  box-shadow:var(--inset)
}
.chip b{font-weight:600;color:var(--ink);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip span{cursor:pointer;font-size:14px;line-height:1}
#cbar{display:flex;align-items:flex-end;gap:11px}
#cwrap{
  flex:1;display:flex;align-items:flex-end;gap:9px;border-radius:24px;padding:5px 6px 5px 18px;
  background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 6px 22px rgba(30,60,100,.14),var(--inset);transition:.16s
}
#cwrap:focus-within{background:rgba(255,255,255,.82);box-shadow:0 8px 26px rgba(10,132,255,.2),var(--inset)}
#inp{
  flex:1;border:none;background:transparent;color:var(--ink);font:inherit;font-size:14.5px;
  resize:none;outline:none;max-height:170px;padding:9px 0;line-height:1.45
}
#inp::placeholder{color:var(--dimmer)}
#send{
  width:46px;height:46px;min-width:46px;border-radius:50%;border:1px solid rgba(255,255,255,.75);
  cursor:pointer;display:grid;place-items:center;transition:.18s;position:relative;overflow:hidden;
  background:radial-gradient(130% 130% at 32% 20%,#7ec2ff 0%,#2b98ff 40%,#0a7bf0 68%,#005ed6 100%);
  box-shadow:0 6px 18px rgba(10,132,255,.42), inset 0 2px 3px rgba(255,255,255,.85),
             inset 0 -3px 6px rgba(0,60,140,.3)
}
#send::after{
  content:'';position:absolute;left:14%;top:7%;width:72%;height:38%;border-radius:50%;
  background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none
}
#send svg{width:20px;height:20px;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,50,120,.4));
  position:relative;z-index:1;margin-left:1px}
#send:active{transform:scale(.9)}
#send:disabled{
  background:radial-gradient(130% 130% at 32% 20%,#e6edf5,#c3cfdd 60%,#aebccc);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.8);cursor:default
}
#send:disabled svg{fill:rgba(255,255,255,.85);filter:none}
#drop{
  position:fixed;inset:12px;border:3px dashed rgba(255,255,255,.95);border-radius:var(--r);z-index:60;
  display:none;place-items:center;font-size:17px;font-weight:680;color:#fff;
  background:rgba(10,132,255,.28);backdrop-filter:blur(10px);text-shadow:0 1px 4px rgba(0,50,120,.4)
}
#drop.on{display:grid}

/* ---------------- empty + modal ---------------- */
#empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--dim);padding:40px}
#empty h2{font-size:19px;font-weight:680;color:var(--ink);margin-bottom:9px;letter-spacing:-.3px}
#empty p{font-size:14px;max-width:400px;line-height:1.65}
#empty code{font:13px ui-monospace,Menlo,monospace;background:rgba(255,255,255,.65);
  padding:3px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.8)}
.mask{position:fixed;inset:0;background:rgba(20,45,80,.3);backdrop-filter:blur(6px);z-index:70;
  display:none;place-items:center}
.mask.on{display:grid}
.modal{
  background:rgba(255,255,255,.82);backdrop-filter:blur(40px) saturate(190%);
  -webkit-backdrop-filter:blur(40px) saturate(190%);
  border-radius:28px;width:420px;max-width:92vw;border:1px solid rgba(255,255,255,.9);
  box-shadow:0 24px 70px rgba(20,50,90,.3),var(--inset);overflow:hidden;
  animation:mup .24s cubic-bezier(.2,.9,.3,1.15)
}
@keyframes mup{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.modal h3{padding:18px 22px 13px;font-size:16px;font-weight:680;letter-spacing:-.25px}
.mbody{padding:0 16px 6px;max-height:340px;overflow-y:auto}
.mfoot{padding:13px 20px 18px;display:flex;gap:9px;justify-content:flex-end}
.mbtn{
  border:1px solid rgba(255,255,255,.8);border-radius:15px;padding:9px 20px;font:inherit;
  font-size:13.5px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.6);color:var(--ink);
  box-shadow:var(--inset);transition:.14s
}
.mbtn:hover{background:rgba(255,255,255,.9)}
.mbtn.p{
  color:#fff;border-color:rgba(255,255,255,.4);
  background:radial-gradient(130% 130% at 32% 20%,#5cb2ff,#0a84ff 52%,#0062e0);
  box-shadow:0 5px 15px rgba(10,132,255,.36),inset 0 1px 1px rgba(255,255,255,.6)
}
.mbtn:active{transform:scale(.96)}
.mbtn:disabled{opacity:.42;cursor:default;transform:none}
.pick{display:flex;align-items:center;gap:11px;padding:8px 8px;border-radius:16px;cursor:pointer}
.pick:hover{background:rgba(255,255,255,.55)}
.pick input{accent-color:var(--blue);width:17px;height:17px}
.pick span{font-weight:580;font-size:13.5px}
.gname{
  width:100%;padding:11px 15px;border-radius:16px;border:1px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.6);color:var(--ink);font:inherit;font-size:14px;outline:none;
  margin-bottom:8px;box-shadow:var(--inset)
}
.gname:focus{background:rgba(255,255,255,.9);border-color:rgba(10,132,255,.55)}
</style>
</head>
<body>
<div id="sky"></div>
<div id="app">
  <aside id="side" class="glass">
    <div id="sidetop">
      <div id="brand"><span id="dot"></span><b>Switchboard</b>
        <button id="newbtn" title="New group">+</button></div>
      <input id="search" placeholder="Search" autocomplete="off">
    </div>
    <div id="convs"></div>
  </aside>
  <section id="main" class="glass">
    <div id="head" style="display:none">
      <div><div id="htitle"></div><div id="hsub"></div></div>
      <div id="hact">
        <button class="hbtn" id="renameBtn">Rename</button>
        <button class="hbtn" id="clearBtn">Clear</button>
      </div>
    </div>
    <div id="empty">
      <div>
        <h2>Nobody is connected</h2>
        <p>Start the server with <code>node server.mjs</code>, then pick someone on the left.
           Everyone in <code>agents.json</code> shows up here automatically.</p>
      </div>
    </div>
    <div id="msgs" style="display:none"></div>
    <div id="comp" style="display:none">
      <div id="files"></div>
      <div id="cbar">
        <div id="cwrap"><textarea id="inp" rows="1" placeholder="Message"></textarea></div>
        <button id="send" disabled aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M2.6 21.4 22 12 2.6 2.6l.02 7.3L16 12 2.62 14.1z"/></svg>
        </button>
      </div>
    </div>
  </section>
</div>
<div id="drop">Drop files to attach</div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
const API = location.origin;
let AGENTS = [], GROUPS = [], TH = {}, UNREAD = {}, TYPING = {},
    CUR = null, CURC = null, connected = false, ATTACH = [], Q = '';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function hue(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))%360; return h; }
function avatar(a){
  const nm = a.name || a.id;
  const init = a.members ? '&#9679;'
    : nm.split(/[\s-]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const h = hue(a.id);
  const st = a.members ? '' :
    `<i class="st" style="background:${
      a.status==='working' ? '#ff9f0a' :
      a.status==='error'   ? '#ff453a' :
      a.enabled===false || a.status==='off' ? '#adbccd' : '#30d158'}"></i>`;
  return `<div class="av" style="background:
    radial-gradient(130% 130% at 30% 20%, hsl(${h} 78% 66%), hsl(${h} 66% 52%) 55%, hsl(${(h+26)%360} 62% 42%))">${init}${st}</div>`;
}
const timeOf = ts => new Date(ts||Date.now()).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
function dayOf(ts){
  const d=new Date(ts||Date.now()), n=new Date();
  if(d.toDateString()===n.toDateString()) return 'Today';
  const y=new Date(n); y.setDate(n.getDate()-1);
  if(d.toDateString()===y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
}
function fmt(t){
  return String(t).split(/```/).map((p,i)=> i%2
    ? '<pre>'+esc(p.replace(/^\w*\n/,''))+'</pre>'
    : esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>')
  ).join('');
}

/* ---------------- conversations ---------------- */
const threadId = x => x.members ? 'g:'+x.id : 'a:'+x.id;
function convs(){
  const list = [
    { id:'@all', name:'Everyone', members:AGENTS.map(a=>a.id), all:true },
    ...GROUPS.map(g=>({...g, members:g.members||[]})),
    ...AGENTS,
  ];
  if(!Q) return list;
  const q=Q.toLowerCase();
  return list.filter(c => (c.name||c.id).toLowerCase().includes(q));
}
const lastOf = tid => (TH[tid]&&TH[tid].length) ? TH[tid][TH[tid].length-1] : null;

function renderConvs(){
  const el=$('convs'); el.innerHTML='';
  const all=convs(), groups=all.filter(c=>c.members), people=all.filter(c=>!c.members);
  const add = c => {
    const tid = c.all ? 'main' : threadId(c);
    const d=document.createElement('div');
    d.className='cv'+(CUR===tid?' on':'');
    const last=lastOf(tid), un=UNREAD[tid]||0;
    const live = !c.members && c.activityText;
    const prev = live ? c.activityText
      : last ? (last.role==='you'?'You: ':'')+String(last.text).replace(/\s+/g,' ').slice(0,58)
      : (c.members ? c.members.length+' agents' : (c.role||c.kind||''));
    d.innerHTML = avatar(c) +
      `<div class="meta">
         <div class="row1"><span class="nm">${esc(c.name||c.id)}</span>
           ${last?`<span class="tm">${timeOf(last.at)}</span>`:''}</div>
         <div class="pv ${live?'act':''}">${esc(prev)}</div>
       </div>` + (un?`<span class="badge">${un>99?'99+':un}</span>`:'');
    d.onclick=()=>openThread(tid,c);
    el.appendChild(d);
  };
  if(groups.length){ const h=document.createElement('div'); h.className='grp'; h.textContent='GROUPS'; el.appendChild(h); groups.forEach(add); }
  if(people.length){ const h=document.createElement('div'); h.className='grp'; h.textContent='AGENTS'; el.appendChild(h); people.forEach(add); }
  if(!groups.length && !people.length) el.innerHTML='<div class="grp" style="padding:18px 8px">No matches</div>';
}

/* ---------------- thread ---------------- */
function openThread(tid,c){
  CUR=tid; CURC=c; UNREAD[tid]=0;
  $('empty').style.display='none';
  $('head').style.display='flex'; $('msgs').style.display='flex'; $('comp').style.display='block';
  $('renameBtn').style.display = c.members ? 'none' : '';
  renderConvs(); renderHead(); renderMsgs(); $('inp').focus();
}
function renderHead(){
  if(!CURC) return;
  $('htitle').textContent = CURC.name || CURC.id;
  const sub=$('hsub');
  if(CURC.members){
    sub.className='';
    sub.textContent = CURC.all ? AGENTS.length+' agents'
      : CURC.members.map(id=>(AGENTS.find(a=>a.id===id)||{}).name||id).join(', ');
  } else if(CURC.activityText){
    sub.className='live'; sub.textContent=CURC.activityText;
  } else {
    sub.className='';
    const bits=[CURC.role||CURC.kind];
    if(CURC.enabled===false) bits.push('off');
    else if(CURC.status==='error') bits.push(CURC.healthNote||'needs setup');
    sub.textContent=bits.filter(Boolean).join(' · ');
  }
}
function renderMsgs(){
  const el=$('msgs'); el.innerHTML='';
  let lastDay='', lastWho='';
  for(const m of (TH[CUR]||[])){
    const d=dayOf(m.at);
    if(d!==lastDay){ const s=document.createElement('div'); s.className='day'; s.textContent=d; el.appendChild(s); lastDay=d; lastWho=''; }
    if(m.role==='system'){
      const b=document.createElement('div');
      b.className='b sys'+(/needs a token|is off\.|do not know how/i.test(m.text)?' err':'');
      b.innerHTML=fmt(m.text); el.appendChild(b); lastWho=''; continue;
    }
    const mine=m.role==='you';
    if(!mine && CURC && CURC.members && m.agent!==lastWho){
      const w=document.createElement('div'); w.className='who';
      w.textContent=(AGENTS.find(a=>a.id===m.agent)||{}).name||m.agent; el.appendChild(w);
    }
    lastWho = mine ? '' : m.agent;
    const b=document.createElement('div'); b.className='b '+(mine?'me':'them');
    b.innerHTML=fmt(m.text); b.title=timeOf(m.at); el.appendChild(b);
  }
  const waiting=Object.keys(TYPING).filter(id=>TYPING[id] &&
    (CURC && (CURC.members ? (CURC.all||CURC.members.includes(id)) : CURC.id===id)));
  if(waiting.length){
    const w=document.createElement('div'); w.className='typing';
    w.innerHTML='<i></i><i></i><i></i>'; el.appendChild(w);
  }
  el.scrollTop=el.scrollHeight;
}

/* ---------------- sending ---------------- */
async function send(){
  const inp=$('inp'); let text=inp.value.trim();
  if(!text && !ATTACH.length) return;
  if(ATTACH.length){
    text += (text?'\n\n':'')+ATTACH.map(f=>`--- ${f.name} ---\n${f.text}`).join('\n\n');
    ATTACH=[]; renderFiles();
  }
  inp.value=''; inp.style.height='auto'; $('send').disabled=true;
  const to = CURC.all ? '@all' : CURC.members ? CURC.members : CURC.id;
  const targets = CURC.all ? AGENTS.filter(a=>a.enabled!==false).map(a=>a.id)
                : CURC.members ? CURC.members : [CURC.id];
  targets.forEach(id=>TYPING[id]=true);
  renderMsgs();
  try{
    await fetch(API+'/api/send',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({to,thread:CUR,text})});
  }catch{
    (TH[CUR]||=[]).push({role:'system',text:'Could not reach the server. Is it still running?',at:Date.now()});
    targets.forEach(id=>TYPING[id]=false); renderMsgs();
  }
}
function renderFiles(){
  const el=$('files'); el.innerHTML='';
  ATTACH.forEach((f,i)=>{
    const c=document.createElement('div'); c.className='chip';
    c.innerHTML=`<b>${esc(f.name)}</b><span>&times;</span>`;
    c.querySelector('span').onclick=()=>{ATTACH.splice(i,1);renderFiles();syncSend()};
    el.appendChild(c);
  });
}
const syncSend = ()=>{ $('send').disabled = !($('inp').value.trim()||ATTACH.length); };

/* ---------------- live stream ---------------- */
function ingest(e){
  if(e.type==='msg'){
    const tid=e.thread||'main';
    (TH[tid]||=[]).push({...e, at:e.at||Date.now()});
    if(e.role!=='you') TYPING[e.agent]=false;
    if(tid!==CUR && e.role!=='you') UNREAD[tid]=(UNREAD[tid]||0)+1;
    if(tid===CUR) renderMsgs();
    renderConvs();
  }
  if(e.type==='status'){
    const a=AGENTS.find(x=>x.id===e.agent);
    if(a){ a.status=e.status; renderConvs(); if(CURC&&CURC.id===a.id) renderHead(); }
  }
  if(e.type==='activity'){
    const a=AGENTS.find(x=>x.id===e.agent);
    if(a){ a.activity=e.activity; a.activityText=e.text; renderConvs(); if(CURC&&CURC.id===a.id) renderHead(); }
  }
  if(e.type==='meta'){
    const a=AGENTS.find(x=>x.id===e.agent);
    if(a&&e.name){ a.name=e.name; renderConvs(); if(CURC&&CURC.id===a.id) renderHead(); }
  }
}
function stream(){
  try{
    const es=new EventSource(API+'/api/stream');
    es.onopen=()=>{ if(!connected) load(); };
    es.onmessage=m=>{ try{ ingest(JSON.parse(m.data)); }catch{} };
    es.onerror=()=>{ es.close(); connected=false; $('dot').classList.remove('on'); setTimeout(stream,4000); };
  }catch{ setTimeout(stream,4000); }
}
async function load(){
  try{
    const r=await fetch(API+'/api/agents',{signal:AbortSignal.timeout(3000)});
    const j=await r.json();
    AGENTS=j.agents||[]; GROUPS=j.groups||[];
    connected=true; $('dot').classList.add('on');
    renderConvs();
    if(!CUR&&AGENTS.length) openThread('main',{id:'@all',name:'Everyone',members:AGENTS.map(a=>a.id),all:true});
  }catch{ connected=false; $('dot').classList.remove('on'); }
}
async function history(){
  try{
    const r=await fetch(API+'/api/events'); const j=await r.json();
    for(const e of (j.events||[])) if(e.type==='msg') (TH[e.thread||'main']||=[]).push({...e, at:e.at||Date.now()});
    renderConvs(); if(CUR) renderMsgs();
  }catch{}
}

/* ---------------- modals ---------------- */
const closeModal = ()=> $('mask').classList.remove('on');
$('mask').onclick = e => { if(e.target===$('mask')) closeModal(); };

function newGroup(){
  $('modal').innerHTML=`<h3>New group</h3>
    <div class="mbody">
      <input class="gname" id="gn" placeholder="Group name" autocomplete="off">
      ${AGENTS.map(a=>`<label class="pick"><input type="checkbox" value="${esc(a.id)}">${avatar(a)}
        <span>${esc(a.name)}</span></label>`).join('')}
    </div>
    <div class="mfoot"><button class="mbtn" id="gc">Cancel</button>
      <button class="mbtn p" id="gk" disabled>Create</button></div>`;
  $('mask').classList.add('on'); $('gn').focus();
  const boxes=[...$('modal').querySelectorAll('input[type=checkbox]')];
  const upd=()=>{ $('gk').disabled=!($('gn').value.trim()&&boxes.some(b=>b.checked)); };
  boxes.forEach(b=>b.onchange=upd); $('gn').oninput=upd;
  $('gc').onclick=closeModal;
  $('gk').onclick=async()=>{
    const name=$('gn').value.trim(), members=boxes.filter(b=>b.checked).map(b=>b.value);
    const id='g'+Date.now().toString(36);
    GROUPS.push({id,name,members});
    try{ await fetch(API+'/api/groups',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({groups:GROUPS})}); }catch{}
    closeModal(); renderConvs(); openThread('g:'+id,{id,name,members});
  };
}
function renameAgent(){
  if(!CURC||CURC.members) return;
  $('modal').innerHTML=`<h3>Rename ${esc(CURC.name)}</h3>
    <div class="mbody"><input class="gname" id="rn" maxlength="18" value="${esc(CURC.name)}"></div>
    <div class="mfoot"><button class="mbtn" id="rc">Cancel</button>
      <button class="mbtn p" id="rk">Save</button></div>`;
  $('mask').classList.add('on');
  const f=$('rn'); f.focus(); f.select();
  $('rc').onclick=closeModal;
  $('rk').onclick=async()=>{
    const name=f.value.trim(); if(!name) return;
    try{ await fetch(API+'/api/rename',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({id:CURC.id,name})}); }catch{}
    CURC.name=name; const a=AGENTS.find(x=>x.id===CURC.id); if(a) a.name=name;
    closeModal(); renderConvs(); renderHead();
  };
}

/* ---------------- wiring ---------------- */
$('newbtn').onclick=newGroup;
$('renameBtn').onclick=renameAgent;
$('clearBtn').onclick=()=>{ if(CUR){ TH[CUR]=[]; renderMsgs(); renderConvs(); } };
$('search').oninput=e=>{ Q=e.target.value; renderConvs(); };
$('send').onclick=send;
const inp=$('inp');
inp.oninput=()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,170)+'px'; syncSend(); };
inp.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); if(!$('send').disabled) send(); } };
document.onkeydown=e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){ e.preventDefault(); $('search').focus(); $('search').select(); }
  if(e.key==='Escape'){ if($('mask').classList.contains('on')) closeModal(); else { $('search').value=''; Q=''; renderConvs(); } }
};
let dragDepth=0;
addEventListener('dragenter',e=>{ e.preventDefault(); if(++dragDepth===1&&CUR) $('drop').classList.add('on'); });
addEventListener('dragleave',()=>{ if(--dragDepth<=0){ dragDepth=0; $('drop').classList.remove('on'); } });
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{
  e.preventDefault(); dragDepth=0; $('drop').classList.remove('on');
  if(!CUR) return;
  for(const f of [...(e.dataTransfer.files||[])].slice(0,6)){
    if(f.size>240*1024){ ATTACH.push({name:f.name,text:'[skipped, larger than 240kb]'}); continue; }
    try{ ATTACH.push({name:f.name,text:await f.text()}); }catch{}
  }
  renderFiles(); syncSend();
});

renderConvs(); stream(); load(); history();
setInterval(()=>{ if(connected) load(); }, 15000);
</script>
</body>
</html>
